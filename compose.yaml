services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: victor
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: notes_app
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U victor -d notes_app"]
      interval: 2s
      retries: 15

  api:
    build: .
    environment:
      DATABASE_URL: postgres://victor:devpass@db:5432/notes_app
      ALLOWED_ORIGIN: http://localhost:3000
      PORT: "4000"
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
